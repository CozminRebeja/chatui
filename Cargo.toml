[package]
name = "chatui"
version = "0.5.0"
edition = "2024"
description = "Tiny end-to-end encrypted terminal chat"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["std"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
