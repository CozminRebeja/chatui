[package]
name = "chatui"
version = "0.3.0"
edition = "2024"
description = "Tiny end-to-end encrypted terminal chat"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["std"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
