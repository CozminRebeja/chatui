[package]
name = "chatui"
version = "0.9.6"
edition = "2024"
description = "Tiny end-to-end encrypted terminal chat"
repository = "https://github.com/CozminRebeja/chatui"

[package.metadata.deb]
maintainer = "Cozmin Rebeja <cozmin.r.cr@gmail.com>"
copyright = "Cozmin Rebeja"
section = "net"
extended-description = "Tiny end-to-end encrypted terminal chat for you and your friends."

[dependencies]
argon2 = "0.5.3"
chrono = { version = "0.4.45", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["std"] }
crypto_secretbox = "0.1.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
vodozemac = { version = "=0.11.0", default-features = false, features = ["precomputed-tables"] }
zeroize = "1.9.1"
